name: CI (fork)

# Fork PRs run the identical test suite on GitHub-hosted runners: untrusted code never executes
# on StarSling's self-hosted runners (ci.yml skips fork PRs by design), and this workflow has no
# access to repo secrets. Same contract, different infrastructure.
on:
  pull_request:

# One in-flight run per ref — a new push cancels the previous, still-running run for that branch.
concurrency:
  group: ci-fork-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gate only reads the checked-out code.
permissions:
  contents: read

jobs:
  test-fork:
    name: test (fork)
    # Inverse of ci.yml's guard: this job exists only for pull requests from forks.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit SHA (the tag comment is for humans only) so a
      # moved/compromised tag can't silently change what runs in CI.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so any provenance/ancestry guard can verify a recorded skill commit is an
          # ancestor of HEAD (a shallow depth-1 checkout wouldn't contain those commits).
          fetch-depth: 0
          # The gate only reads code (it never pushes), so don't leave the job token in .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      # Node is required for the dogfood-loop JS test: tests/test_dogfood_retry_node.py runs
      # dogfood-retry.test.mjs under `node` and hard-fails in CI if node is missing.
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run tests
        run: pytest -v
