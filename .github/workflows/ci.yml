name: CI

# Runs the full test suite (`pytest -v`) on every push to main and every pull request — the same
# suite a developer runs locally must pass before code can merge.
on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref — a new push cancels the previous, still-running CI for that branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gate only reads the checked-out code.
permissions:
  contents: read

jobs:
  test:
    # This repo dogfoods StarSling runners for its own CI. The runner is self-hosted, so never
    # execute untrusted fork-PR code on it: run only for pushes and pull requests whose head is
    # this same repository. Fork PRs get the identical suite on GitHub-hosted runners via
    # ci-fork.yml instead.
    runs-on: starsling-ubuntu-24.04
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Third-party actions are pinned to a commit SHA (the tag comment is for humans only) so a
      # moved/compromised tag can't silently change what runs in CI.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so any provenance/ancestry guard can verify a recorded skill commit is an
          # ancestor of HEAD (a shallow depth-1 checkout wouldn't contain those commits).
          fetch-depth: 0
          # The gate only reads code (it never pushes), so don't leave the job token in .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      # Node is required for the dogfood-loop JS test: tests/test_dogfood_retry_node.py runs
      # dogfood-retry.test.mjs under `node` and hard-fails in CI if node is missing.
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run tests
        run: pytest -v
